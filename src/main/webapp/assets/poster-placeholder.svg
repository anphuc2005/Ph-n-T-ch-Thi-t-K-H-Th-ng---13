<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181a26"/>
      <stop offset="50%" stop-color="#12141d"/>
      <stop offset="100%" stop-color="#0b0c12"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="primaryRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1f2d"/>
      <stop offset="100%" stop-color="#b80d17"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)"/>
  <rect width="400" height="600" fill="url(#redGlow)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="360" height="560" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Cinema Reel / Clapperboard Icon -->
  <g transform="translate(140, 190)">
    <circle cx="60" cy="60" r="54" fill="#1b1f2e" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
    <circle cx="60" cy="60" r="22" fill="#12141c" stroke="#e50914" stroke-width="3"/>
    <circle cx="60" cy="24" r="7" fill="#e50914"/>
    <circle cx="60" cy="96" r="7" fill="#e50914"/>
    <circle cx="24" cy="60" r="7" fill="#e50914"/>
    <circle cx="96" cy="60" r="7" fill="#e50914"/>
    <!-- Play symbol in center -->
    <polygon points="56,52 68,60 56,68" fill="#ffffff"/>
  </g>

  <!-- Brand & Text -->
  <text x="200" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="3" fill="#ffffff">
    CINE<tspan fill="#e50914">MAN</tspan>
  </text>
  <text x="200" y="395" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="4" fill="#f59e0b">
    CINEMA EXPERIENCE
  </text>
  <text x="200" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">
    Poster đang được cập nhật
  </text>
</svg>
